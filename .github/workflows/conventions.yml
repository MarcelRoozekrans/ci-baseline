name: conventions

# Shared repo conventions: Conventional Commits on the commits a pull request adds, and relative
# links in Markdown that resolve. Works for any repo, with or without .NET code.

on:
  workflow_call:
    inputs:
      commitlint:
        description: Run commitlint on the commits a pull request adds.
        type: boolean
        default: true
      commitlint-config:
        description: Path of the repo's commitlint config. Empty means the repo's own config if it has one, otherwise the house config.
        type: string
        default: ""
      commit-hygiene:
        description: Check the commits a pull request adds for AI co-author trailers, AI session links and AI signature lines, and that release-please can parse them.
        type: boolean
        default: false
      markdown-links:
        description: Check the relative links in the repo's Markdown files.
        type: boolean
        default: true
      markdown-exclude:
        description: Space separated directories whose Markdown files the link check leaves out.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "conventions.yml does not run on pull_request_target. Call it on pull_request." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::conventions.yml does not run on pull_request_target: that event runs with the base branch's secrets and a write token, so checking out pull request code there is unsafe. Call conventions.yml on pull_request instead."
          exit 1
      - name: commitlint disabled
        if: ${{ !inputs.commitlint }}
        run: echo "commitlint disabled by caller input" >> "$GITHUB_STEP_SUMMARY"
      - name: Not a pull request
        if: inputs.commitlint && github.event_name != 'pull_request'
        run: |
          echo "Not a pull request: commitlint checks the commits a pull request adds." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.commitlint && github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      # The internal actions come from this workflow's own repository and commit, the
      # ones the caller's `uses:` resolved to, so a caller on a tag or a SHA gets
      # matching actions.
      - name: Check the called workflow's identity
        if: inputs.commitlint && github.event_name == 'pull_request'
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository is '$WORKFLOW_REPOSITORY' and job.workflow_sha is '$WORKFLOW_SHA'; both must be set to check out the ci-baseline actions at the called workflow's commit"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.commitlint && github.event_name == 'pull_request'
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-baseline
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.commitlint && github.event_name == 'pull_request'
        with:
          node-version: 24
      - uses: ./.ci-baseline/actions/commitlint
        if: inputs.commitlint && github.event_name == 'pull_request'
        with:
          from: ${{ github.event.pull_request.base.sha }}
          to: ${{ github.event.pull_request.head.sha }}
          config: ${{ inputs.commitlint-config }}

  commit-hygiene:
    name: commit-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "conventions.yml does not run on pull_request_target. Call it on pull_request." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::conventions.yml does not run on pull_request_target: that event runs with the base branch's secrets and a write token, so checking out pull request code there is unsafe. Call conventions.yml on pull_request instead."
          exit 1
      - name: commit-hygiene disabled
        if: ${{ !inputs.commit-hygiene }}
        run: echo "commit-hygiene disabled by caller input" >> "$GITHUB_STEP_SUMMARY"
      - name: Not a pull request
        if: inputs.commit-hygiene && github.event_name != 'pull_request'
        run: |
          echo "Not a pull request: commit-hygiene checks the commits a pull request adds." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.commit-hygiene && github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      # The internal actions come from this workflow's own repository and commit, the
      # ones the caller's `uses:` resolved to, so a caller on a tag or a SHA gets
      # matching actions.
      - name: Check the called workflow's identity
        if: inputs.commit-hygiene && github.event_name == 'pull_request'
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository is '$WORKFLOW_REPOSITORY' and job.workflow_sha is '$WORKFLOW_SHA'; both must be set to check out the ci-baseline actions at the called workflow's commit"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.commit-hygiene && github.event_name == 'pull_request'
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-baseline
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.commit-hygiene && github.event_name == 'pull_request'
        with:
          node-version: 24
      - uses: ./.ci-baseline/actions/commit-hygiene
        if: inputs.commit-hygiene && github.event_name == 'pull_request'
        with:
          from: ${{ github.event.pull_request.base.sha }}
          to: ${{ github.event.pull_request.head.sha }}
          pr-body: ${{ github.event.pull_request.body }}

  markdown-links:
    name: markdown-links
    runs-on: ubuntu-latest
    steps:
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "conventions.yml does not run on pull_request_target. Call it on pull_request." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::conventions.yml does not run on pull_request_target: that event runs with the base branch's secrets and a write token, so checking out pull request code there is unsafe. Call conventions.yml on pull_request instead."
          exit 1
      - name: markdown-links disabled
        if: ${{ !inputs.markdown-links }}
        run: echo "markdown-links disabled by caller input" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.markdown-links
        with:
          persist-credentials: false
      # The internal actions come from this workflow's own repository and commit, the
      # ones the caller's `uses:` resolved to, so a caller on a tag or a SHA gets
      # matching actions.
      - name: Check the called workflow's identity
        if: inputs.markdown-links
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository is '$WORKFLOW_REPOSITORY' and job.workflow_sha is '$WORKFLOW_SHA'; both must be set to check out the ci-baseline actions at the called workflow's commit"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.markdown-links
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-baseline
          persist-credentials: false
      # check_links.py always skips .ci-baseline, so the ci-baseline checkout is not checked.
      - uses: ./.ci-baseline/actions/markdown-links
        if: inputs.markdown-links
        with:
          exclude: ${{ inputs.markdown-exclude }}
