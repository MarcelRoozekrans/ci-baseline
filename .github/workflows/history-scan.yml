name: history-scan

on:
  workflow_call:
    secrets:
      GITLEAKS_CONFIG:
        description: Optional gitleaks TOML content, used instead of the repo's own config.
        required: false

permissions:
  contents: read

jobs:
  history-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch all branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      # The internal actions come from this workflow's own repository and commit, the
      # ones the caller's `uses:` resolved to, so a caller on a tag or a SHA gets
      # matching actions.
      - name: Check the called workflow's identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository is '$WORKFLOW_REPOSITORY' and job.workflow_sha is '$WORKFLOW_SHA'; both must be set to check out the ci-baseline actions at the called workflow's commit"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-baseline
          persist-credentials: false
      - name: Write gitleaks config
        id: cfg
        env:
          GITLEAKS_CONFIG: ${{ secrets.GITLEAKS_CONFIG }}
        run: |
          if [ -n "$GITLEAKS_CONFIG" ]; then
            umask 077
            printf '%s\n' "$GITLEAKS_CONFIG" > "$RUNNER_TEMP/gitleaks.toml"
            echo "path=$RUNNER_TEMP/gitleaks.toml" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.ci-baseline/actions/gitleaks
        with:
          mode: history
          config: ${{ steps.cfg.outputs.path }}
          report-path: ${{ runner.temp }}/gitleaks-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          retention-days: 7
          if-no-files-found: ignore
