name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

# The release PR is written with a token from the release bot GitHub App, not GITHUB_TOKEN, so the PR gets its own
# CI run. The App needs the RELEASE_BOT_CLIENT_ID variable and the RELEASE_BOT_PRIVATE_KEY secret.
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Callers pin @v1. Moves the major tag to the release commit. If this job fails, move the tag by hand as the README says.
  move-major-tag:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MAJOR: ${{ needs.release-please.outputs.major }}
      SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Move the major tag
        run: |
          set -euo pipefail
          git tag -f "v$MAJOR" "$SHA"
          git push -f origin "refs/tags/v$MAJOR"
          echo "Moved v$MAJOR to $SHA." >> "$GITHUB_STEP_SUMMARY"
