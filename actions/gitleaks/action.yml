name: gitleaks
description: Scan git history or a commit range for secrets with a pinned gitleaks binary. Findings are always redacted.
inputs:
  mode:
    description: "range scans the commits in log-opts; history scans every ref."
    required: true
  source:
    description: Path of the git repository to scan.
    default: "."
  log-opts:
    description: "git log options for range mode, for example base..head."
    default: ""
  config:
    description: "Path to a gitleaks TOML. Empty means the repo's .gitleaks.toml if present, else the gitleaks defaults. The config in use must have an [extend] table with useDefault = true, or the run fails: without it the config replaces the default rules."
    default: ""
  report-path:
    description: Where to write a JSON report. Empty means no report.
    default: ""
outputs:
  result:
    description: "clean, findings or error. Set before the step fails, so callers can tell why it failed."
    value: ${{ steps.scan.outputs.result }}
runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/../../lib/install-pinned.sh" "$GITLEAKS_URL" "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks-bin"'
    - name: Run gitleaks
      id: scan
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        SOURCE: ${{ inputs.source }}
        LOG_OPTS: ${{ inputs.log-opts }}
        CONFIG: ${{ inputs.config }}
        REPORT_PATH: ${{ inputs.report-path }}
        LIB: ${{ github.action_path }}/../../lib/baseline_lib.py
      run: |
        # Actions runs bash with -e; the exit codes below are handled by hand.
        set +e -uo pipefail
        fail_error() { # message
          echo "result=error" >> "$GITHUB_OUTPUT"
          echo "gitleaks ($MODE): error, $1" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$1"
          exit 1
        }
        # gitleaks would otherwise pick its config from these instead of from the checks below.
        unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
        args=(git "$SOURCE" --redact --no-banner --exit-code 1)
        case "$MODE" in
          range)
            [ -n "$LOG_OPTS" ] || fail_error "mode range needs log-opts"
            args+=("--log-opts=$LOG_OPTS")
            ;;
          history) args+=("--log-opts=--all") ;;
          *) fail_error "mode must be range or history, got: $MODE" ;;
        esac
        # gitleaks reads the repo's .gitleaks.toml when no config is given.
        effective="$CONFIG"
        [ -n "$effective" ] || { [ -f "$SOURCE/.gitleaks.toml" ] && effective="$SOURCE/.gitleaks.toml"; }
        if [ -n "$effective" ]; then
          # The CLI prints a single ::error:: line on failure; pass its text on.
          if ! msg=$(python3 "$LIB" gitleaks-config --path "$effective"); then
            fail_error "${msg#::error::}"
          fi
        fi
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        report=${REPORT_PATH:-$RUNNER_TEMP/gitleaks-report-$$.json}
        rm -f "$report"
        args+=(--report-format json --report-path "$report")

        gitleaks "${args[@]}"
        rc=$?

        # Only counts and pass/fail go to the summary, never finding contents.
        # gitleaks also exits 1 on fatal errors, so the report decides. A run
        # without a readable report is an error, whatever the exit code.
        count=""
        if [ -f "$report" ]; then
          count=$(jq -e 'if type == "array" then length else empty end' "$report" 2>/dev/null) || count=""
        fi
        if [ -n "$count" ] && [ "$rc" -eq 0 ] && [ "$count" -eq 0 ]; then
          echo "result=clean" >> "$GITHUB_OUTPUT"
          echo "gitleaks ($MODE): 0 findings, passed" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ -n "$count" ] && [ "$rc" -eq 1 ] && [ "$count" -ge 1 ]; then
          noun=findings
          [ "$count" -eq 1 ] && noun=finding
          echo "result=findings" >> "$GITHUB_OUTPUT"
          echo "gitleaks ($MODE): $count $noun, failed" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::gitleaks found secrets ($count $noun, values redacted)"
          exit 1
        fi
        if [ -z "$count" ]; then
          fail_error "gitleaks failed to run: exit code $rc and no readable report"
        fi
        fail_error "gitleaks failed to run: exit code $rc with $count report entries"
