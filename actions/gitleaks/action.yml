name: gitleaks
description: Scan git history or a commit range for secrets with a pinned gitleaks binary. Findings are always redacted.
inputs:
  mode:
    description: "range scans the commits in log-opts; history scans every ref."
    required: true
  source:
    description: Path of the git repository to scan.
    default: "."
  log-opts:
    description: "git log options for range mode, for example base..head."
    default: ""
  config:
    description: Path to a gitleaks TOML. Empty means gitleaks defaults plus the repo's .gitleaks.toml if present.
    default: ""
  report-path:
    description: Where to write a JSON report. Empty means no report.
    default: ""
runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: ${{ github.action_path }}/../../lib/install-pinned.sh "$GITLEAKS_URL" "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks-bin"
    - name: Run gitleaks
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        SOURCE: ${{ inputs.source }}
        LOG_OPTS: ${{ inputs.log-opts }}
        CONFIG: ${{ inputs.config }}
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        # Actions runs bash with -e; the exit codes below are handled by hand.
        set +e -uo pipefail
        args=(git "$SOURCE" --redact --no-banner --exit-code 1)
        case "$MODE" in
          range)
            if [ -z "$LOG_OPTS" ]; then
              echo "::error::mode range needs log-opts"
              exit 2
            fi
            args+=("--log-opts=$LOG_OPTS")
            ;;
          history) args+=("--log-opts=--all") ;;
          *)
            echo "::error::mode must be range or history, got: $MODE"
            exit 2
            ;;
        esac
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        report=${REPORT_PATH:-$RUNNER_TEMP/gitleaks-report-$$.json}
        rm -f "$report"
        args+=(--report-format json --report-path "$report")

        gitleaks "${args[@]}"
        rc=$?

        # Only counts and pass/fail go to the summary, never finding contents.
        # gitleaks also exits 1 on fatal errors, so the report decides.
        count=""
        if [ -f "$report" ]; then
          count=$(jq -e 'if type == "array" then length else empty end' "$report" 2>/dev/null) || count=""
        fi
        if [ "$rc" -eq 0 ] && [ "${count:-0}" -eq 0 ]; then
          echo "gitleaks ($MODE): 0 findings, passed" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ "$rc" -ne 0 ] && [ -n "$count" ] && [ "$count" -ge 1 ]; then
          noun=findings
          [ "$count" -eq 1 ] && noun=finding
          echo "gitleaks ($MODE): $count $noun, failed" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::gitleaks found secrets ($count $noun, values redacted)"
          exit 1
        fi
        echo "gitleaks ($MODE): failed to run, exit code $rc" >> "$GITHUB_STEP_SUMMARY"
        echo "::error::gitleaks failed to run (exit $rc)"
        exit "$([ "$rc" -ne 0 ] && echo "$rc" || echo 1)"
