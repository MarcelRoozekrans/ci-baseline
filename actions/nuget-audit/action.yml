name: nuget-audit
description: Restore a solution with NuGetAudit enabled and fail on advisories at or above the chosen level. A guard first fails the run if NoWarn or WarningsNotAsErrors mutes an audit code.
inputs:
  solution:
    description: Path of the .sln or .slnx to restore. Empty means the single solution file in working-directory.
    default: ""
  nuget-audit-level:
    description: "Lowest advisory severity that fails the run: low, moderate, high or critical."
    default: moderate
  working-directory:
    description: Directory the solution is resolved and restored in.
    default: "."
outputs:
  guard-result:
    description: "clean when no audit code is muted, violations when the NoWarn guard failed the run, error when the solution or a project could not be read."
    value: ${{ steps.resolve.outputs.guard-result || steps.guard.outputs.guard-result }}
  advisory-codes:
    description: "Semicolon separated NU190x codes found in the restore log. Empty when none were found or restore did not run."
    value: ${{ steps.summary.outputs.advisory-codes }}
runs:
  using: composite
  steps:
    - name: Resolve solution and failing codes
      id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SOLUTION: ${{ inputs.solution }}
        LEVEL: ${{ inputs.nuget-audit-level }}
        LIB: ${{ github.action_path }}/../../lib/baseline_lib.py
      run: |
        set -euo pipefail
        fail_error() { # message
          echo "guard-result=error" >> "$GITHUB_OUTPUT"
          echo "guard: error, $1" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$1"
          exit 1
        }
        # The CLI prints a single ::error:: line on failure; pass its text on.
        if ! sln=$(python3 "$LIB" resolve-solution --root . --solution "$SOLUTION"); then fail_error "${sln#::error::}"; fi
        if ! codes=$(python3 "$LIB" failing-codes --level "$LEVEL"); then fail_error "${codes#::error::}"; fi
        if [ "$LEVEL" != moderate ]; then
          echo "nuget-audit-level: $LEVEL, not the default moderate. Failing codes: $codes" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "sln=$sln" >> "$GITHUB_OUTPUT"
        echo "codes=$codes" >> "$GITHUB_OUTPUT"
        # Per-invocation log directory, so one run never reads another run's log.
        echo "log=$(mktemp -d "$RUNNER_TEMP/nuget-audit.XXXXXX")/restore.log" >> "$GITHUB_OUTPUT"
    - name: Guard against muted audit codes
      id: guard
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SLN: ${{ steps.resolve.outputs.sln }}
        CODES: ${{ steps.resolve.outputs.codes }}
        LIB: ${{ github.action_path }}/../../lib/baseline_lib.py
      run: |
        set -euo pipefail
        fail_error() { # message
          echo "guard-result=error" >> "$GITHUB_OUTPUT"
          echo "guard: error, $1" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$1"
          exit 1
        }
        evals=$(mktemp "$RUNNER_TEMP/nuget-audit-evals.XXXXXX")
        sln_dir=$(dirname "$SLN")
        if ! projects=$(dotnet sln "$SLN" list); then
          echo "$projects"
          fail_error "dotnet sln list failed for $SLN"
        fi
        # Called as `query ... || fail_error`, which turns off -e inside it, so each failure returns by hand.
        query() { # project tfm [extra msbuild args]
          local out
          out=$(dotnet msbuild "$1" -getProperty:NoWarn -getProperty:WarningsNotAsErrors -getItem:PackageReference "${@:3}") \
            || { echo "$out"; return 1; }
          jq -c --arg project "$1" --arg tfm "$2" '. + {project: $project, tfm: $tfm}' <<< "$out" >> "$evals"
        }
        while IFS= read -r rel; do
          [ -n "$rel" ] || continue
          proj="$sln_dir/${rel//\\//}"
          if ! outer=$(dotnet msbuild "$proj" -getProperty:TargetFrameworks -getProperty:TargetFramework); then
            echo "$outer"
            fail_error "dotnet msbuild could not evaluate $proj"
          fi
          # TargetFrameworks may span several lines, so drop all whitespace first.
          if ! tfms=$(jq -r '.Properties.TargetFrameworks // ""' <<< "$outer" | tr -d '[:space:]'); then
            fail_error "could not read TargetFrameworks of $proj from the msbuild output"
          fi
          if [ -z "$tfms" ] && ! tfms=$(jq -r '.Properties.TargetFramework // ""' <<< "$outer" | tr -d '[:space:]'); then
            fail_error "could not read TargetFramework of $proj from the msbuild output"
          fi
          if [ -z "$tfms" ]; then
            # No target framework at all: still evaluate the project once.
            query "$proj" "(none)" || fail_error "could not evaluate NoWarn of $proj"
            continue
          fi
          IFS=';' read -r -a list <<< "$tfms"
          for tfm in "${list[@]}"; do
            [ -n "$tfm" ] || continue
            query "$proj" "$tfm" "-p:TargetFramework=$tfm" || fail_error "could not evaluate NoWarn of $proj for $tfm"
          done
        done <<< "$(tail -n +3 <<< "$projects")"
        status=0
        violations=$(jq -s . "$evals" | python3 "$LIB" nowarn-check --codes "$CODES") || status=$?
        if [ "$status" -eq 2 ]; then
          # The CLI prints a single ::error:: line; pass its text on.
          fail_error "could not check the evaluated projects: ${violations#::error::}"
        fi
        if [ "$status" -ne 0 ]; then
          echo "guard-result=violations" >> "$GITHUB_OUTPUT"
          echo "guard: violations found" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$line"
          done <<< "$violations"
          echo "::error::NoWarn or WarningsNotAsErrors mutes a NuGet audit code ($CODES). Use NuGetAuditSuppress for an accepted advisory instead; see the NuGetAuditSuppress section of the ci-baseline README."
          exit 1
        fi
        echo "guard-result=clean" >> "$GITHUB_OUTPUT"
        echo "guard: clean, no audit code muted" >> "$GITHUB_STEP_SUMMARY"
    - name: Restore with NuGetAudit
      id: restore
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SLN: ${{ steps.resolve.outputs.sln }}
        CODES: ${{ steps.resolve.outputs.codes }}
        LOG: ${{ steps.resolve.outputs.log }}
      run: |
        set -euo pipefail
        # TreatWarningsAsErrors=false: an advisory below nuget-audit-level stays a
        # warning even in a repo that turns all warnings into errors.
        dotnet restore "$SLN" --force -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low \
          -p:TreatWarningsAsErrors=false "-p:WarningsAsErrors=\"$CODES\"" 2>&1 | tee "$LOG"
    - name: Summarize advisories
      id: summary
      if: always()
      shell: bash
      env:
        LOG: ${{ steps.resolve.outputs.log }}
      run: |
        # GitHub runs bash with -e; grep finding nothing must not abort the summary.
        set +e -uo pipefail
        rows=""
        nodata=""
        codes=""
        ran=false
        if [ -n "$LOG" ] && [ -f "$LOG" ]; then
          ran=true
          rows=$(sed -nE "s/.*(NU190[1-4]): (Warning As Error: )?Package '([^']+)' ([^ ]+) has a known [a-z]+ severity vulnerability, (https?:[^ ]+).*/| \1 | \3 | \4 | \5 |/p" "$LOG" | sort -u)
          nodata=$(sed -nE "s/.*(NU1905: .*)/\1/p" "$LOG" | sort -u)
          codes=$(grep -oE 'NU190[1-4]' <<< "$rows" | sort -u | paste -sd';' -)
        fi
        echo "advisory-codes=$codes" >> "$GITHUB_OUTPUT"
        {
          echo "### NuGet audit"
          if [ "$ran" != true ]; then
            echo "Restore did not run, so no advisories were checked. See the guard result above."
          fi
          if [ -n "$rows" ]; then
            echo "| Code | Package | Version | Advisory |"
            echo "| --- | --- | --- | --- |"
            echo "$rows"
          fi
          if [ -n "$nodata" ]; then
            echo ""
            echo "Audit source had no vulnerability data:"
            echo '```'
            echo "$nodata"
            echo '```'
          fi
          if [ "$ran" = true ] && [ -z "$rows" ] && [ -z "$nodata" ]; then
            echo "No advisories."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$nodata" ]; then
          echo "::warning::NuGet audit had no vulnerability data from at least one source (NU1905), so those packages were not checked"
        fi
